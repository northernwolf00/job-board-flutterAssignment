name: interviews_flutter_assignment
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.1+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  sqflite: ^2.4.2
  go_router: ^16.2.1
  path: ^1.9.1
  flutter_otp_text_field: ^1.5.1+1
  shared_preferences: ^2.5.3
  provider: ^6.1.1
  file_picker: ^10.3.2
  syncfusion_flutter_pdf: ^23.2.4
  connectivity_plus: ^5.0.2
  get_it: ^8.2.0
  http: ^1.5.0
  process_run: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  mockito: ^5.4.2
  build_runner: ^2.4.7  

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true


  assets:
    - assets/jobs.json





